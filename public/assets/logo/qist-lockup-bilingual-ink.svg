<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 581 160" width="581" height="160">
  <title>Qist bilingual lockup, dark ink</title>
  <desc>Splash, app-store, out-of-home and marketing only. Never inside the product, never in an app bar, never as an icon, never below a 96px symbol. Symbol 120, Latin Oxanium 200 86px, rule 1x56 at 42% ink, Arabic Noto Kufi Arabic 100 81px. Latin first in LTR settings, Arabic first in RTL ones. Both wordmarks outlined to paths from Oxanium 200 and Noto Kufi Arabic 100 (both SIL OFL); no font dependency. Dark-ink polarity for light backgrounds: neutral ink #1f1f1f, accent unchanged, rule at the same 42% opacity.</desc>
