<script>
  // ---------------------------------------------------------------------
  // Pure derivation module — Credit Card Payments & Monthly Cash-Flow
  // Planning. No DOM access, no store access — everything takes inputs and
  // returns values. See specs/002-credit-card-planning/data-model.md and
  // the spec's "Cash-Flow Calculation Rules" for the rules implemented here.
  // ---------------------------------------------------------------------

  /** Pending/Paid/Overdue projection (BR-002, FR-009). Never stored. */
  function ccStatus_(payment, todayIso) {
    if (payment.paid) return 'Paid';
    if (payment.dueDate && payment.dueDate < todayIso) return 'Overdue';
    return 'Pending';
  }

  /** "yyyy-mm-dd" -> "yyyy-mm" grouping key (FR-020, BR-001). */
  function monthKey_(isoDate) {
    return String(isoDate).slice(0, 7);
  }

  /** Clamps a day-of-month to the last real day of that month (BR-006). */
  function clampDayToMonth_(year, month, day) {
    var lastDay = new Date(year, month, 0).getDate(); // month is 1-based here
    return Math.min(day, lastDay);
  }

  /** yyyy-mm-dd for a given year/1-based-month/day, day clamped to month end. */
  function monthDateIso_(year, month, day) {
    var d = clampDayToMonth_(year, month, day);
    var mm = String(month).padStart(2, '0');
    var dd = String(d).padStart(2, '0');
    return year + '-' + mm + '-' + dd;
  }

  /** Blank/whitespace statement month defaults to the due date's month (FR-006). */
  function parseStatementMonth_(text, dueDate) {
    var trimmed = String(text || '').trim();
    if (trimmed) return trimmed;
    if (!dueDate) return '';
    var parts = String(dueDate).split('-');
    return parts[1] + '/' + parts[0];
  }

  // -----------------------------------------------------------------------
  // US2 — combined dated timeline for one month (T020)
  // -----------------------------------------------------------------------

  /**
   * Merges CC payments + installments dated in `monthKey` into Obligation
   * Timeline Entries, sorted date-ascending (same-date entries kept
   * separate). Returns entries plus category subtotals and totals.
   */
  function buildMonthObligations_(state, monthKey, todayIso) {
    var entries = [];
    var ccTotal = 0, installmentTotal = 0, stillToPay = 0;

    (state.creditCards.payments || []).forEach(function (p) {
      if (!p.dueDate || monthKey_(p.dueDate) !== monthKey) return;
      var status = ccStatus_(p, todayIso);
      entries.push({ date: p.dueDate, sourceType: 'creditCard', sourceName: p.card, amountEgp: p.amountEgp, status: status });
      ccTotal += p.amountEgp;
      if (status !== 'Paid') stillToPay += p.amountEgp;
    });

    (state.installments.rows || []).forEach(function (r) {
      if (!r.dueDate || monthKey_(r.dueDate) !== monthKey) return;
      var status = r.paid ? 'Paid' : (r.dueDate < todayIso ? 'Overdue' : 'Pending');
      entries.push({ date: r.dueDate, sourceType: 'installment', sourceName: r.name, amountEgp: r.amountEgp, status: status });
      installmentTotal += r.amountEgp;
      if (status !== 'Paid') stillToPay += r.amountEgp;
    });

    entries.sort(function (a, b) { return a.date.localeCompare(b.date); });

    return {
      entries: entries,
      ccTotal: ccTotal,
      installmentTotal: installmentTotal,
      totalObligations: ccTotal + installmentTotal,
      stillToPay: stillToPay
    };
  }

  // -----------------------------------------------------------------------
  // US3 — income projection into a month (T026-T027)
  // -----------------------------------------------------------------------

  /**
   * Projects the salary into `monthKey` on the clamped salary day (FR-015,
   * BR-006), converting non-EGP at the current USD rate (BR-005, FR-016).
   * incomeUnavailable is true — never a converted 0 — when the rate is
   * missing/zero/non-finite for a non-EGP salary (FR-017).
   */
  function buildIncomeEvents_(state, monthKey) {
    var salary = state.income.salary;
    if (!salary) return { events: [], totalIncome: 0, incomeUnavailable: false };

    var parts = monthKey.split('-').map(Number);
    var year = parts[0], month = parts[1];
    var date = monthDateIso_(year, month, salary.day);

    if (salary.currency === 'EGP') {
      return {
        events: [{ date: date, amountEgp: salary.amount, original: { amount: salary.amount, currency: 'EGP' } }],
        totalIncome: salary.amount,
        incomeUnavailable: false
      };
    }

    var rate = state.rates && state.rates.usd ? state.rates.usd.value : 0;
    if (!rate || !isFinite(rate)) {
      return { events: [], totalIncome: 0, incomeUnavailable: true };
    }
    var amountEgp = salary.amount * rate;
    return {
      events: [{ date: date, amountEgp: amountEgp, original: { amount: salary.amount, currency: salary.currency } }],
      totalIncome: amountEgp,
      incomeUnavailable: false
    };
  }

  /**
   * Extends a month's obligation totals with income and the two verdicts
   * that don't require the day-by-day walk (rules 7-8). B0 is the opening
   * balance for THIS month (current month: total.totalOfAll; later months:
   * the previous month's closing balance, per the caller).
   */
  function computeMonthTotals_(obligations, incomeInfo, openingBalance) {
    var monthlyRemaining = openingBalance + incomeInfo.totalIncome - obligations.stillToPay;
    var monthlyShortage = Math.max(0, -monthlyRemaining);
    return { monthlyRemaining: monthlyRemaining, monthlyShortage: monthlyShortage };
  }

  // -----------------------------------------------------------------------
  // US4 — day-by-day running-balance walk (T030-T031)
  // -----------------------------------------------------------------------

  /**
   * Walks the running balance across one month's events (spec rules 1-10,
   * implemented literally). `events` is the unsorted obligation timeline
   * entries (unpaid only) + income events for the month; this function
   * builds the signed, sorted event list itself.
   */
  function walkMonth_(obligationEntries, incomeEvents, openingBalance, todayIso, isCurrentMonth) {
    var signed = [];
    obligationEntries.forEach(function (e) {
      if (e.status === 'Paid') return; // FR-028 — paid obligations never enter the walk
      signed.push({ date: e.date, amount: -e.amountEgp, isIncome: false });
    });
    incomeEvents.forEach(function (e) {
      signed.push({ date: e.date, amount: e.amountEgp, isIncome: true });
    });

    if (isCurrentMonth) {
      signed = signed.filter(function (e) { return e.date >= todayIso; }); // rule 10
    }

    // Date ascending; same-date obligations (negatives) before income (BR-007).
    signed.sort(function (a, b) {
      if (a.date !== b.date) return a.date.localeCompare(b.date);
      if (a.isIncome !== b.isIncome) return a.isIncome ? 1 : -1;
      return 0;
    });

    var balance = openingBalance;
    var firstShortfallDate = null;
    var minBalance = openingBalance;
    var minBalanceBeforeIncome = 0; // deficit right before the next income event
    var seenIncome = false;
    var deficitBeforeIncome = 0;

    signed.forEach(function (e) {
      balance += e.amount;
      if (balance < 0 && firstShortfallDate === null) firstShortfallDate = e.date;
      if (!seenIncome) {
        if (balance < deficitBeforeIncome) deficitBeforeIncome = balance;
        if (e.isIncome) seenIncome = true;
      }
    });

    var amountToPrepare = deficitBeforeIncome < 0 ? -deficitBeforeIncome : 0; // rule 5

    return {
      firstShortfallDate: firstShortfallDate,
      amountToPrepare: amountToPrepare,
      closingBalance: balance
    };
  }

  /**
   * Assembles the full Monthly Plan object (data-model.md) for one month.
   */
  function computeMonthlyPlan(state, monthKey, openingBalance, isProjection) {
    var todayIso = todayIsoLocal_();
    var isCurrentMonth = monthKey === monthKey_(todayIso);

    var obligations = buildMonthObligations_(state, monthKey, todayIso);
    var incomeInfo = buildIncomeEvents_(state, monthKey);
    var totals = computeMonthTotals_(obligations, incomeInfo, openingBalance);
    var walk = walkMonth_(obligations.entries, incomeInfo.events, openingBalance, todayIso, isCurrentMonth);

    var timeline = obligations.entries.concat(incomeInfo.events.map(function (e) {
      return { date: e.date, sourceType: 'income', sourceName: 'income', amountEgp: e.amountEgp, status: 'Pending' };
    })).sort(function (a, b) { return a.date.localeCompare(b.date); });

    return {
      month: monthKey,
      openingBalance: openingBalance,
      openingAsOf: state.meta.fetchedAt,
      incomeEvents: incomeInfo.events,
      incomeUnavailable: incomeInfo.incomeUnavailable,
      totalIncome: incomeInfo.totalIncome,
      ccTotal: obligations.ccTotal,
      installmentTotal: obligations.installmentTotal,
      totalObligations: obligations.totalObligations,
      stillToPay: obligations.stillToPay,
      timeline: timeline,
      firstShortfallDate: walk.firstShortfallDate,
      amountToPrepare: walk.amountToPrepare,
      closingBalance: walk.closingBalance,
      monthlyRemaining: totals.monthlyRemaining,
      monthlyShortage: totals.monthlyShortage,
      isProjection: !!isProjection
    };
  }

  // -----------------------------------------------------------------------
  // US5 — 12-month forecast (T034)
  // -----------------------------------------------------------------------

  /** Adds `n` calendar months to a "yyyy-mm" key. */
  function addMonths_(monthKey, n) {
    var parts = monthKey.split('-').map(Number);
    var total = (parts[0] * 12 + (parts[1] - 1)) + n;
    var year = Math.floor(total / 12);
    var month = (total % 12) + 1;
    return year + '-' + String(month).padStart(2, '0');
  }

  /**
   * Chains `horizonMonths` Monthly Plans, current month opening from
   * state.total.totalOfAll, each later month opening from the previous
   * month's closingBalance (negatives carried, FR-029/BR-008).
   */
  function computeForecast(state, horizonMonths) {
    var currentMonth = monthKey_(todayIsoLocal_());
    var months = [];
    var opening = state.total.totalOfAll;

    for (var i = 0; i < horizonMonths; i++) {
      var monthKey = addMonths_(currentMonth, i);
      var plan = computeMonthlyPlan(state, monthKey, opening, i > 0);
      months.push(plan);
      opening = plan.closingBalance;
    }

    var horizonEnd = addMonths_(currentMonth, horizonMonths - 1);
    var beyondHorizonTotal = 0;
    (state.creditCards.payments || []).forEach(function (p) {
      if (p.dueDate && monthKey_(p.dueDate) > horizonEnd && !p.paid) beyondHorizonTotal += p.amountEgp;
    });
    (state.installments.rows || []).forEach(function (r) {
      if (r.dueDate && monthKey_(r.dueDate) > horizonEnd && !r.paid) beyondHorizonTotal += r.amountEgp;
    });

    return { months: months, beyondHorizonTotal: beyondHorizonTotal };
  }

  // -----------------------------------------------------------------------
  // US6 — Home summary (T037)
  // -----------------------------------------------------------------------

  /**
   * Current-month total/still-to-pay, the nearest unpaid obligation
   * (falling forward across months when the current month is fully paid,
   * US6 #3), and the current month's shortage indicator when non-zero.
   */
  function computeHomeSummary(state) {
    var currentMonth = monthKey_(todayIsoLocal_());
    var plan = computeMonthlyPlan(state, currentMonth, state.total.totalOfAll, false);

    var nearestUnpaid = null;
    var pendingEntries = plan.timeline.filter(function (e) {
      return e.sourceType !== 'income' && e.status !== 'Paid';
    });
    if (pendingEntries.length) {
      nearestUnpaid = pendingEntries[0];
    } else {
      // Fall forward across future months until an unpaid obligation is found.
      var opening = plan.closingBalance;
      for (var i = 1; i <= 12 && !nearestUnpaid; i++) {
        var monthKey = addMonths_(currentMonth, i);
        var futurePlan = computeMonthlyPlan(state, monthKey, opening, true);
        var futurePending = futurePlan.timeline.filter(function (e) {
          return e.sourceType !== 'income' && e.status !== 'Paid';
        });
        if (futurePending.length) nearestUnpaid = futurePending[0];
        opening = futurePlan.closingBalance;
      }
    }

    return {
      monthTotalDue: plan.totalObligations,
      stillToPay: plan.stillToPay,
      nearestUnpaid: nearestUnpaid,
      shortageIndicator: plan.amountToPrepare > 0 ? { amountToPrepare: plan.amountToPrepare } : null
    };
  }
</script>
