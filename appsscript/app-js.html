<script>
  // ---------------------------------------------------------------------
  // Store (T012)
  // ---------------------------------------------------------------------
  var store = {
    state: null,
    lang: localStorage.getItem('isc:lang') || 'en',
    pending: [],
    stale: false
  };

  var charts = {};

  function persistState() {
    try { sessionStorage.setItem('isc:state', JSON.stringify(store.state)); } catch (e) { /* quota/full — cache is best-effort */ }
  }

  function loadCachedState() {
    try {
      var raw = sessionStorage.getItem('isc:state');
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  // ---------------------------------------------------------------------
  // RPC promise wrapper (T012) — 30s timeout, 1 retry for reads only
  // ---------------------------------------------------------------------
  var WRITE_RPCS = {
    addTransaction: 1, setInstallmentPaid: 1, setRate: 1, setAccountAmount: 1,
    addAccount: 1, setLiabilityAmount: 1, setPropertyPaid: 1, takeSnapshot: 1,
    addCcPayment: 1, setCcPaymentStatus: 1, updateCcPayment: 1, deleteCcPayment: 1, setSalary: 1
  };

  function parseErrorCode_(message) {
    var m = /\[(\w+)\]\s*$/.exec(String(message || ''));
    return m ? m[1] : null;
  }

  function stripErrorCode_(message) {
    return String(message || '').replace(/\s*\[\w+\]\s*$/, '');
  }

  function attemptRpc_(name, args, attemptsLeft, isWrite) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        reject({ message: 'Request timed out. [TIMEOUT]' });
      }, 30000);

      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        clearTimeout(timer);
        reject({ message: 'google.script.run unavailable outside Apps Script. [TIMEOUT]' });
        return;
      }

      google.script.run
        .withSuccessHandler(function (result) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(result);
        })
        .withFailureHandler(function (error) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          reject(error);
        })[name].apply(null, args);
    }).catch(function (err) {
      if (!isWrite && attemptsLeft > 1) {
        return attemptRpc_(name, args, attemptsLeft - 1, isWrite);
      }
      throw err;
    });
  }

  function rpc(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    var isWrite = !!WRITE_RPCS[name];
    return attemptRpc_(name, args, isWrite ? 1 : 2, isWrite);
  }

  // ---------------------------------------------------------------------
  // Reconciliation — merge a write RPC's returned slice into store.state
  // ---------------------------------------------------------------------
  function reconcileSlice(slice) {
    if (!slice) return;
    Object.keys(slice).forEach(function (k) {
      if (k === 'recent' || k === 'monthly') {
        store.state.transactions[k] = slice[k];
      } else {
        store.state[k] = slice[k];
      }
    });
    persistState();
  }

  // ---------------------------------------------------------------------
  // Toasts
  // ---------------------------------------------------------------------
  function toast(message, type) {
    var stack = document.getElementById('toastStack');
    var el = document.createElement('div');
    el.className = 'toast' + (type ? ' ' + type : '');
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(function () { el.remove(); }, 3200);
  }

  var ERROR_TOAST_KEY = {
    VALIDATION: 'toastValidation',
    RANGE_DENIED: 'toastRangeDenied',
    LOG_FULL: 'toastLogFull',
    LOCK_TIMEOUT: 'toastLockTimeout',
    DUPLICATE_NAME: 'toastDuplicateName',
    MARKER_MISSING: 'toastStructureChanged',
    TIMEOUT: 'toastStale'
  };

  function showErrorToastForError_(err) {
    var code = parseErrorCode_(err && err.message);
    if (code === 'TIMEOUT') { store.stale = true; renderAsOfIndicator(); }
    var key = ERROR_TOAST_KEY[code] || 'toastFailed';
    var msg = key === 'toastValidation' ? t(key, { msg: stripErrorCode_(err.message) }) : t(key);
    toast(msg, 'error');
  }

  // ---------------------------------------------------------------------
  // Confirm dialog
  // ---------------------------------------------------------------------
  function confirmDialog(message) {
    var overlay = document.getElementById('confirmOverlay');
    var msgEl = document.getElementById('confirmMessage');
    var okBtn = document.getElementById('confirmOk');
    var cancelBtn = document.getElementById('confirmCancel');
    msgEl.textContent = message;
    overlay.classList.remove('hidden');
    return new Promise(function (resolve) {
      function cleanup(result) {
        overlay.classList.add('hidden');
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
        resolve(result);
      }
      function onOk() { cleanup(true); }
      function onCancel() { cleanup(false); }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
    });
  }

  // ---------------------------------------------------------------------
  // Optimistic write helper (T012/T016+) — used by every write flow
  // ---------------------------------------------------------------------
  function optimisticWrite(config) {
    config.apply();
    renderActiveScreen();
    var args = [config.rpcName].concat(config.args || []);
    return rpc.apply(null, args)
      .then(function (slice) {
        reconcileSlice(slice);
        renderActiveScreen();
        if (config.successToastKey) toast(t(config.successToastKey), 'success');
        return slice;
      })
      .catch(function (err) {
        var code = parseErrorCode_(err && err.message);
        if (config.silentCodes && config.silentCodes.indexOf(code) !== -1) {
          renderActiveScreen();
          return null;
        }
        config.revert();
        renderActiveScreen();
        showErrorToastForError_(err);
        return null;
      });
  }

  // ---------------------------------------------------------------------
  // Chart lifecycle helper (T017)
  // ---------------------------------------------------------------------
  var CHART_COLORS = ['#1F3864', '#2E75B6', '#D4A017', '#9AA5B1', '#6B4F3B'];

  function upsertChart(canvasId, config) {
    var canvas = document.getElementById(canvasId);
    if (!canvas) return;
    if (charts[canvasId]) { charts[canvasId].destroy(); delete charts[canvasId]; }
    if (typeof Chart === 'undefined') return;
    var isArabic = store.lang === 'ar';
    config.options = config.options || {};
    config.options.plugins = config.options.plugins || {};
    config.options.plugins.legend = Object.assign({ rtl: isArabic, textDirection: isArabic ? 'rtl' : 'ltr' }, config.options.plugins.legend || {});
    config.options.plugins.tooltip = Object.assign({ rtl: isArabic, textDirection: isArabic ? 'rtl' : 'ltr' }, config.options.plugins.tooltip || {});
    config.options.responsive = true;
    // Requires a height-constrained parent (.chart-frame) — see styles.html.
    config.options.maintainAspectRatio = false;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      config.options.animation = false;
    }
    charts[canvasId] = new Chart(canvas.getContext('2d'), config);
  }

  // ---------------------------------------------------------------------
  // Small UI helpers
  // ---------------------------------------------------------------------
  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function bdi(text) {
    var b = document.createElement('bdi');
    b.textContent = text;
    return b;
  }

  function daysBetween_(isoDate) {
    if (!isoDate) return null;
    var parts = isoDate.split('-').map(Number);
    var due = new Date(parts[0], parts[1] - 1, parts[2]);
    var today = new Date();
    today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    return Math.round((due - today) / 86400000);
  }

  function todayIsoLocal_() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function selectedSegmentValue(container) {
    var btn = container.querySelector('.segmented-btn.selected');
    return btn ? btn.getAttribute('data-value') : null;
  }

  function setSegmentSelected(container, value) {
    container.querySelectorAll('.segmented-btn').forEach(function (b) {
      b.classList.toggle('selected', b.getAttribute('data-value') === value);
    });
  }

  function wireSegmented(container) {
    container.querySelectorAll('.segmented-btn').forEach(function (b) {
      b.addEventListener('click', function () { setSegmentSelected(container, b.getAttribute('data-value')); });
    });
  }

  // ---------------------------------------------------------------------
  // Router (T012/T013)
  // ---------------------------------------------------------------------
  var SCREEN_RENDERERS = {}; // populated below per screen

  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
    var target = document.getElementById('screen-' + name);
    if (target) target.classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-nav') === name);
    });
    if (store.state && SCREEN_RENDERERS[name]) SCREEN_RENDERERS[name]();
  }

  function renderActiveScreen() {
    var active = document.querySelector('.screen.active');
    if (!active || !store.state) return;
    var name = active.getAttribute('data-screen');
    if (SCREEN_RENDERERS[name]) SCREEN_RENDERERS[name]();
  }

  function initNav() {
    document.querySelectorAll('.nav-btn[data-nav]').forEach(function (b) {
      b.addEventListener('click', function () { showScreen(b.getAttribute('data-nav')); });
    });
    var moreList = document.getElementById('moreMenuList');
    var MORE_ITEMS = [
      ['accounts', 'moreAccounts'], ['rates', 'moreRates'], ['networth', 'moreNetWorth'],
      ['total', 'moreTotal'], ['history', 'moreHistory'], ['transactions', 'moreTransactions'],
      ['cards', 'moreCards'], ['forecast', 'moreForecast'],
      ['settings', 'moreSettings']
    ];
    moreList.innerHTML = '';
    MORE_ITEMS.forEach(function (item) {
      var li = el('li', 'list-row');
      var main = el('div', 'list-row-main');
      main.appendChild(el('span', 'list-row-title', t(item[1])));
      main.setAttribute('data-t-title', item[1]);
      li.appendChild(main);
      li.appendChild(el('span', '', store.lang === 'ar' ? '‹' : '›'));
      li.addEventListener('click', function () { showScreen(item[0]); });
      moreList.appendChild(li);
    });
  }

  // ---------------------------------------------------------------------
  // "data as of" indicator (T013)
  // ---------------------------------------------------------------------
  function renderAsOfIndicator() {
    var target = document.getElementById('asOfIndicator');
    if (!store.state || !store.state.meta) { target.textContent = ''; return; }
    var d = new Date(store.state.meta.fetchedAt);
    // The clock reading is a Latin-digit LTR run; isolate it or RTL reorders
    // the neutral space and renders "PM 06:26".
    target.textContent = t('dataAsOf') + ' ';
    target.appendChild(bdi(d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })));
    if (store.stale) target.appendChild(document.createTextNode(' ⚠'));
  }

  // =======================================================================
  // Screen: Home (T014-T017)
  // =======================================================================
  function renderHome() {
    renderHomePlanCard();
    var d = store.state.dashboard;
    var grid = document.getElementById('homeKpiGrid');
    grid.innerHTML = '';

    function kpiCard(labelKey, value, opts) {
      opts = opts || {};
      var card = el('div', 'kpi-card');
      card.appendChild(el('div', 'kpi-label', t(labelKey)));
      var valueEl = el('div', 'kpi-value' + (opts.danger ? ' danger' : ''), opts.text || fmt(value));
      card.appendChild(valueEl);
      if (opts.sub) card.appendChild(el('div', 'kpi-sub', opts.sub));
      if (opts.badge) card.appendChild(opts.badge);
      return card;
    }

    grid.appendChild(kpiCard('netWorth', d.netWorthCurrent));
    grid.appendChild(kpiCard('totalAssets', d.totalAssets));
    grid.appendChild(kpiCard('liquid', d.liquid));
    grid.appendChild(kpiCard('investments', d.investments));

    var nextCard = el('div', 'kpi-card');
    nextCard.appendChild(el('div', 'kpi-label', t('nextInstallmentDue')));
    nextCard.appendChild(el('div', 'kpi-value', d.nextInstallment && d.nextInstallment.date ? fmt(d.nextInstallment.amount) + ' — ' + fmtDate(d.nextInstallment.date) : '—'));
    if (d.nextInstallment && d.nextInstallment.date) {
      var days = daysBetween_(d.nextInstallment.date);
      var badgeText = days > 0 ? t('daysLeft', { n: days }) : (days === 0 ? t('dueToday') : t('overdueBy', { n: Math.abs(days) }));
      nextCard.appendChild(el('span', 'countdown-badge', badgeText));
    }
    grid.appendChild(nextCard);

    grid.appendChild(kpiCard('overdueCount', d.overdueCount, { danger: d.overdueCount > 0 }));
    grid.appendChild(kpiCard('dueNext12', d.dueNext12Months));
    grid.appendChild(kpiCard('usdRate', d.usdRate));

    upsertChart('chartAssetMix', {
      type: 'doughnut',
      data: {
        labels: (d.assetMix || []).map(function (m) { return m.label; }),
        datasets: [{ data: (d.assetMix || []).map(function (m) { return m.egp; }), backgroundColor: CHART_COLORS }]
      }
    });

    upsertChart('chartUnpaidByYear', {
      type: 'bar',
      data: {
        labels: (d.unpaidByYear || []).map(function (u) { return String(u.year); }),
        datasets: [{ data: (d.unpaidByYear || []).map(function (u) { return u.amount; }), backgroundColor: '#2E75B6' }]
      },
      options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
    });
  }
  SCREEN_RENDERERS.home = renderHome;

  // =======================================================================
  // Screen: Add Transaction (T018-T020)
  // =======================================================================
  var addFormInited = false;

  function initAddForm() {
    if (addFormInited) return;
    addFormInited = true;

    var typeToggle = document.getElementById('typeToggle');
    var currencyToggle = document.getElementById('currencyToggle');
    wireSegmented(typeToggle);
    wireSegmented(currencyToggle);
    setSegmentSelected(typeToggle, 'Expense');
    setSegmentSelected(currencyToggle, 'EGP');

    var chipsContainer = document.getElementById('categoryChips');
    chipsContainer.innerHTML = '';
    CATEGORY_KEYS.forEach(function (pair) {
      var chip = el('button', 'chip', t(pair[1]));
      chip.type = 'button';
      chip.setAttribute('data-value', pair[0]);
      chip.setAttribute('data-t', pair[1]);
      chip.addEventListener('click', function () {
        chipsContainer.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('selected'); });
        chip.classList.add('selected');
      });
      chipsContainer.appendChild(chip);
    });

    document.getElementById('dateInput').value = todayIsoLocal_();

    document.getElementById('addForm').addEventListener('submit', function (e) {
      e.preventDefault();
      submitAddTransaction();
    });
  }

  function resetAddFormDefaults() {
    setSegmentSelected(document.getElementById('typeToggle'), 'Expense');
    setSegmentSelected(document.getElementById('currencyToggle'), 'EGP');
    document.getElementById('categoryChips').querySelectorAll('.chip').forEach(function (c) { c.classList.remove('selected'); });
    document.getElementById('dateInput').value = todayIsoLocal_();
    document.getElementById('amountInput').value = '';
    document.getElementById('noteInput').value = '';
  }

  function submitAddTransaction() {
    var type = selectedSegmentValue(document.getElementById('typeToggle')) || 'Expense';
    var category = document.getElementById('categoryChips').querySelector('.chip.selected');
    category = category ? category.getAttribute('data-value') : null;
    var account = document.getElementById('accountSelect').value;
    var currency = selectedSegmentValue(document.getElementById('currencyToggle')) || 'EGP';
    var date = document.getElementById('dateInput').value;
    var note = document.getElementById('noteInput').value;
    var amountRaw = document.getElementById('amountInput').value;
    var amount = parseFloat(amountRaw);

    if (!category) { toast(t('requiredField'), 'error'); return; }
    if (!account) { toast(t('requiredField'), 'error'); return; }
    if (!date) { toast(t('requiredField'), 'error'); return; }
    if (!amountRaw || isNaN(amount) || amount <= 0) { toast(t('mustBePositive'), 'error'); return; }

    var tx = { date: date, type: type, category: category, account: account, amount: amount, currency: currency, note: note };
    var prevRecent = store.state.transactions.recent.slice();
    var optimisticTx = { row: null, date: date, type: type, category: category, account: account, amount: amount, currency: currency, amountEgp: currency === 'EGP' ? amount : null, note: note };

    optimisticWrite({
      apply: function () { store.state.transactions.recent = [optimisticTx].concat(prevRecent); },
      revert: function () { store.state.transactions.recent = prevRecent; },
      rpcName: 'addTransaction',
      args: [tx],
      successToastKey: 'toastSaved'
    }).then(function (slice) {
      if (slice) {
        document.getElementById('addForm').reset();
        resetAddFormDefaults();
      }
    });
  }

  function renderAccountSelect() {
    var select = document.getElementById('accountSelect');
    var prevValue = select.value;
    select.innerHTML = '';
    (store.state.data || []).forEach(function (acc) {
      var opt = document.createElement('option');
      opt.value = acc.name;
      opt.textContent = acc.name;
      select.appendChild(opt);
    });
    if (prevValue) select.value = prevValue;
  }

  function amountRowClass(type) {
    return type === 'Income' ? 'amount-income' : (type === 'Expense' ? 'amount-expense' : 'amount-transfer');
  }

  function renderRecentTransactions() {
    var list = document.getElementById('recentTransactionsList');
    list.innerHTML = '';
    (store.state.transactions.recent || []).slice(0, 10).forEach(function (txRow) {
      var li = el('li', 'list-row');
      var main = el('div', 'list-row-main');
      var title = el('div', 'list-row-title');
      title.appendChild(bdi(categoryLabel(txRow.category)));
      main.appendChild(title);
      var sub = el('div', 'list-row-sub', fmtDate(txRow.date) + ' · ');
      sub.appendChild(bdi(txRow.account));
      main.appendChild(sub);
      li.appendChild(main);
      var sign = txRow.type === 'Expense' ? '-' : (txRow.type === 'Income' ? '+' : '');
      li.appendChild(el('div', 'list-row-amount ' + amountRowClass(txRow.type), sign + fmt(txRow.amount) + ' ' + txRow.currency));
      list.appendChild(li);
    });
  }

  function renderAdd() {
    initAddForm();
    renderAccountSelect();
    renderRecentTransactions();
  }
  SCREEN_RENDERERS.add = renderAdd;

  // =======================================================================
  // Screen: Installments (T021-T023)
  // =======================================================================
  function installmentStatus_(inst) {
    if (inst.paid) return 'paid';
    var days = daysBetween_(inst.dueDate);
    if (days === null) return 'upcoming';
    if (days < 0) return 'overdue';
    if (days <= 93) return 'dueSoon';
    return 'upcoming';
  }

  function renderInstallmentsSummary() {
    var s = store.state.installments.summary;
    var card = document.getElementById('installmentsSummary');
    card.innerHTML = '';
    card.appendChild(el('h2', '', t('installments')));
    var grid = el('div', 'kpi-grid');
    function mini(labelKey, value) {
      var c = el('div', 'kpi-card');
      c.appendChild(el('div', 'kpi-label', t(labelKey)));
      c.appendChild(el('div', 'kpi-value', fmt(value)));
      return c;
    }
    grid.appendChild(mini('totalScheduled', s.totalScheduled));
    grid.appendChild(mini('totalPaid', s.totalPaid));
    grid.appendChild(mini('totalRemaining', s.totalRemaining));
    grid.appendChild(mini('due3m', s.due3m));
    card.appendChild(grid);
  }

  function markInstallmentPaid(inst) {
    confirmDialog(t('markPaidConfirm', { name: inst.name, amount: fmt(inst.amountEgp) })).then(function (ok) {
      if (!ok) return;
      optimisticWrite({
        apply: function () { inst.paid = true; },
        revert: function () { inst.paid = false; },
        rpcName: 'setInstallmentPaid',
        args: [inst.row],
        successToastKey: 'toastSaved',
        silentCodes: ['ALREADY_PAID']
      });
    });
  }

  function renderInstallmentGroups() {
    var container = document.getElementById('installmentGroups');
    container.innerHTML = '';
    var rows = store.state.installments.rows || [];
    var groups = { overdue: [], dueSoon: [], upcoming: [], paid: [] };
    rows.forEach(function (r) { groups[installmentStatus_(r)].push(r); });

    function renderGroup(key, titleKey, items) {
      if (!items.length) return;
      container.appendChild(el('div', 'status-group-title', t(titleKey)));
      items.forEach(function (inst) {
        var row = el('div', 'installment-row ' + key);
        var main = el('div', 'list-row-main');
        main.appendChild(bdi(inst.name));
        main.appendChild(el('div', 'list-row-sub', fmtDate(inst.dueDate)));
        row.appendChild(main);
        row.appendChild(el('div', 'list-row-amount', fmt(inst.amountEgp)));
        if (key !== 'paid') {
          row.addEventListener('click', function () { markInstallmentPaid(inst); });
        }
        container.appendChild(row);
      });
    }

    renderGroup('overdue', 'groupOverdue', groups.overdue);
    renderGroup('dueSoon', 'groupDueSoon', groups.dueSoon);
    renderGroup('upcoming', 'groupUpcoming', groups.upcoming);

    if (groups.paid.length) {
      var details = document.createElement('details');
      details.className = 'collapse-group';
      var summary = document.createElement('summary');
      summary.textContent = t('groupPaid') + ' (' + groups.paid.length + ')';
      details.appendChild(summary);
      groups.paid.forEach(function (inst) {
        var row = el('div', 'installment-row paid');
        var main = el('div', 'list-row-main');
        main.appendChild(bdi(inst.name));
        main.appendChild(el('div', 'list-row-sub', fmtDate(inst.dueDate)));
        row.appendChild(main);
        row.appendChild(el('div', 'list-row-amount', fmt(inst.amountEgp)));
        details.appendChild(row);
      });
      container.appendChild(details);
    }

    if (!rows.length) container.appendChild(el('p', 'empty-state', t('noneHere')));
  }

  function renderInstallments() {
    renderInstallmentsSummary();
    renderInstallmentGroups();
  }
  SCREEN_RENDERERS.installments = renderInstallments;

  // =======================================================================
  // Screen: Accounts (T026, T028, T030)
  // =======================================================================
  function renderEditableAmountRow(container, opts) {
    // opts: {titleNode, subText, value, onSave(newValue)}
    var row = el('li', 'list-row');
    var main = el('div', 'list-row-main');
    main.appendChild(opts.titleNode);
    if (opts.subText) main.appendChild(el('div', 'list-row-sub', opts.subText));
    row.appendChild(main);

    var display = el('span', 'yellow-figure', fmt(opts.value));
    var editBtn = el('button', 'btn-secondary', t('editAmount'));
    editBtn.type = 'button';
    var wrap = el('div', 'inline-edit');
    wrap.appendChild(display);
    wrap.appendChild(editBtn);
    row.appendChild(wrap);

    editBtn.addEventListener('click', function () {
      wrap.innerHTML = '';
      var input = document.createElement('input');
      input.type = 'text';
      input.inputMode = 'decimal';
      input.className = 'editable';
      input.value = opts.value;
      var saveBtn = el('button', 'btn-primary', '✓');
      saveBtn.type = 'button';
      saveBtn.setAttribute('aria-label', t('save'));
      wrap.appendChild(input);
      wrap.appendChild(saveBtn);
      input.focus();
      saveBtn.addEventListener('click', function () {
        var newVal = parseFloat(input.value);
        if (isNaN(newVal)) { toast(t('mustBeNonNegative'), 'error'); return; }
        opts.onSave(newVal);
      });
    });

    container.appendChild(row);
  }

  function renderAccounts() {
    var list = document.getElementById('accountsList');
    list.innerHTML = '';
    (store.state.data || []).forEach(function (acc) {
      var titleNode = document.createElement('span');
      titleNode.appendChild(bdi(acc.name));
      if (acc.investment) titleNode.appendChild(el('span', 'badge-investment', t('investmentFlag')));
      renderEditableAmountRow(list, {
        titleNode: titleNode,
        subText: acc.category,
        value: acc.amount,
        onSave: function (newVal) {
          var prev = acc.amount;
          optimisticWrite({
            apply: function () { acc.amount = newVal; },
            revert: function () { acc.amount = prev; },
            rpcName: 'setAccountAmount',
            args: [acc.row, newVal],
            successToastKey: 'toastSaved'
          });
        }
      });
    });
  }

  function initAddAccountForm() {
    var form = document.getElementById('addAccountForm');
    if (form.dataset.inited) return;
    form.dataset.inited = '1';
    document.getElementById('accDateInput').value = todayIsoLocal_();
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = document.getElementById('accNameInput').value.trim();
      var category = document.getElementById('accCategorySelect').value;
      var investment = document.getElementById('accInvestmentInput').checked;

  /**

  function ccSetupGuard_(containerId) {

  var ccFormInited = false;

  function ccStatusLabelKey_(status) {
    return status === 'Paid' ? 'statusPaid' : (status === 'Overdue' ? 'statusOverdue' : 'statusPending');
  }

  function initCcPaymentForm() {
    if (ccFormInited) return;
    ccFormInited = true;
    document.getElementById('ccDueDateInput').value = todayIsoLocal_();
    document.getElementById('addCcPaymentForm').addEventListener('submit', function (e) {

  function renderCcCardChips() {
    var container = document.getElementById('ccCardChips');
    var prevSelected = container.querySelector('.chip.selected');
    var prevValue = prevSelected ? prevSelected.getAttribute('data-value') : null;
    container.innerHTML = '';
    (store.state.creditCards.cards || []).forEach(function (name) {
      var chip = el('button', 'chip');
      chip.type = 'button';
      chip.appendChild(bdi(name));
      chip.setAttribute('data-value', name);
      if (name === prevValue) chip.classList.add('selected');
      chip.addEventListener('click', function () {
        container.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('selected'); });
        chip.classList.add('selected');
      });
      container.appendChild(chip);
    });
  }

  function findCcDuplicate_(card, amount, dueDate) {
    var dup = (store.state.creditCards.payments || []).some(function (p) {
      return p.card === card && p.amountEgp === amount && p.dueDate === dueDate;
    });
    if (dup) return 'duplicateWarning';
    var instDup = (store.state.installments.rows || []).some(function (r) {
      return r.amountEgp === amount && r.dueDate === dueDate;
    });
    return instDup ? 'installmentMatchWarning' : null;
  }

  function submitCcPayment() {
    var chip = document.getElementById('ccCardChips').querySelector('.chip.selected');
    var card = chip ? chip.getAttribute('data-value') : null;
    var amountRaw = document.getElementById('ccAmountInput').value;
    var amount = parseFloat(amountRaw);
    var dueDate = document.getElementById('ccDueDateInput').value;
    var statementMonth = document.getElementById('ccStatementMonthInput').value.trim();
    var note = document.getElementById('ccNoteInput').value;

    if (!card) { toast(t('requiredField'), 'error'); return; }
    if (!dueDate) { toast(t('requiredField'), 'error'); return; }
    if (!amountRaw || isNaN(amount) || amount <= 0) { toast(t('mustBePositive'), 'error'); return; }

    var defaultedMonth = parseStatementMonth_(statementMonth, dueDate);
    var warningKey = findCcDuplicate_(card, amount, dueDate);

    function proceed() {
      var payload = { card: card, amount: amount, dueDate: dueDate, statementMonth: defaultedMonth, note: note };
      var prevPayments = store.state.creditCards.payments.slice();
      var optimisticPayment = { row: null, card: card, dueDate: dueDate, amountEgp: amount, statementMonth: defaultedMonth, paid: false, note: note };

      optimisticWrite({
        apply: function () { store.state.creditCards.payments = prevPayments.concat([optimisticPayment]); },
        revert: function () { store.state.creditCards.payments = prevPayments; },
        rpcName: 'addCcPayment',
        args: [payload],
        successToastKey: 'paymentSaved'
      }).then(function (slice) {
        if (slice) {
          document.getElementById('addCcPaymentForm').reset();
          document.getElementById('ccDueDateInput').value = todayIsoLocal_();
          document.getElementById('ccCardChips').querySelectorAll('.chip').forEach(function (c) { c.classList.remove('selected'); });
        }
      });
    }

    if (warningKey) {
      confirmDialog(t(warningKey)).then(function (ok) { if (ok) proceed(); });
    } else {
      proceed();
    }
  }

  /** Inline edit panel (amount/due date/note), toggled by the Edit button — T017. */
  function ccEditPanel_(payment, panel) {
    panel.innerHTML = '';
    panel.classList.add('form');

    var amountField = el('label', 'field');
    amountField.appendChild(el('span', '', t('amount')));
    var amountInput = document.createElement('input');
    amountInput.type = 'text'; amountInput.inputMode = 'decimal'; amountInput.className = 'editable';
    amountInput.value = payment.amountEgp;
    amountField.appendChild(amountInput);

    var dateField = el('label', 'field');
    dateField.appendChild(el('span', '', t('dueDate')));
    var dateInput = document.createElement('input');
    dateInput.type = 'date'; dateInput.className = 'editable';
    dateInput.value = payment.dueDate;
    dateField.appendChild(dateInput);

    var noteField = el('label', 'field');
    noteField.appendChild(el('span', '', t('noteOptional')));
    var noteInput = document.createElement('input');
    noteInput.type = 'text'; noteInput.className = 'editable'; noteInput.maxLength = 500;
    noteInput.value = payment.note || '';
    noteField.appendChild(noteInput);

    var saveBtn = el('button', 'btn-primary', t('save'));
    saveBtn.type = 'button';
    saveBtn.addEventListener('click', function () {
      var amount = parseFloat(amountInput.value);
      var dueDate = dateInput.value;
      if (!dueDate) { toast(t('requiredField'), 'error'); return; }
      if (isNaN(amount) || amount <= 0) { toast(t('mustBePositive'), 'error'); return; }
      var note = noteInput.value;

      var payload = { card: payment.card, amount: amount, dueDate: dueDate, statementMonth: payment.statementMonth, note: note, paid: payment.paid };
      var prev = { amountEgp: payment.amountEgp, dueDate: payment.dueDate, note: payment.note };
      optimisticWrite({
        apply: function () { payment.amountEgp = amount; payment.dueDate = dueDate; payment.note = note; },
        revert: function () { payment.amountEgp = prev.amountEgp; payment.dueDate = prev.dueDate; payment.note = prev.note; },
        rpcName: 'updateCcPayment',
        args: [payment.row, payload],
        successToastKey: 'paymentSaved'
      }).then(function (slice) {
        if (slice) panel.classList.add('hidden');
      });
    });

    panel.appendChild(amountField);
    panel.appendChild(dateField);
    panel.appendChild(noteField);
    panel.appendChild(saveBtn);
  }

  function ccPaymentRow_(payment) {
    var wrap = el('div', '');
    var todayIso = todayIsoLocal_();
    var status = ccStatus_(payment, todayIso);
    var row = el('div', 'installment-row ' + (status === 'Paid' ? 'paid' : (status === 'Overdue' ? 'overdue' : 'dueSoon')));
    var main = el('div', 'list-row-main');
    var sub = el('div', 'list-row-sub', fmtDate(payment.dueDate));
    if (payment.note) { sub.appendChild(document.createTextNode(' · ')); sub.appendChild(bdi(payment.note)); }
    main.appendChild(sub);
    row.appendChild(main);
    row.appendChild(el('div', 'list-row-amount', fmt(payment.amountEgp)));
    var badge = el('span', 'countdown-badge', t(ccStatusLabelKey_(status)));
    row.appendChild(badge);

    row.addEventListener('click', function () {
      var next = !payment.paid;
      var prev = payment.paid;
      optimisticWrite({
        apply: function () { payment.paid = next; },
        revert: function () { payment.paid = prev; },
        rpcName: 'setCcPaymentStatus',
        args: [payment.row, next],
        successToastKey: 'paymentSaved'
      });
    });

    var editPanel = el('div', 'hidden');

    var editBtn = el('button', 'btn-secondary', t('editPayment'));
    editBtn.type = 'button';
    editBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (editPanel.classList.contains('hidden')) ccEditPanel_(payment, editPanel);
      editPanel.classList.toggle('hidden');
    });
    row.appendChild(editBtn);

    var delBtn = el('button', 'btn-secondary', t('deletePayment'));
    delBtn.type = 'button';
    delBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      confirmDialog(t('deletePaymentConfirm')).then(function (ok) {
        if (!ok) return;
        var prevPayments = store.state.creditCards.payments.slice();
        optimisticWrite({
          apply: function () { store.state.creditCards.payments = prevPayments.filter(function (p) { return p.row !== payment.row; }); },
          revert: function () { store.state.creditCards.payments = prevPayments; },
          rpcName: 'deleteCcPayment',
          args: [payment.row],
          successToastKey: 'paymentSaved'
        });
      });
    });
    row.appendChild(delBtn);

    wrap.appendChild(row);
    wrap.appendChild(editPanel);
    return wrap;
  }

  function renderCards() {
    if (ccSetupGuard_('cardsSetupNeeded')) {
      document.getElementById('addCcPaymentForm').classList.add('hidden');
      document.getElementById('cardGroups').innerHTML = '';
      return;
    }
    document.getElementById('addCcPaymentForm').classList.remove('hidden');
    initCcPaymentForm();
    renderCcCardChips();

    var container = document.getElementById('cardGroups');
    container.innerHTML = '';
    var cards = store.state.creditCards.cards || [];
    var payments = store.state.creditCards.payments || [];

    cards.forEach(function (cardName) {
      var cardPayments = payments.filter(function (p) { return p.card === cardName; });
      var section = el('div', 'card');
      var heading = el('h2', '');
      heading.appendChild(bdi(cardName));
      section.appendChild(heading);

      if (!cardPayments.length) {
        section.appendChild(el('p', 'empty-state', t('nothingDue')));
        container.appendChild(section);
        return;
      }

      var byMonth = {};
      cardPayments.forEach(function (p) {
        var mk = monthKey_(p.dueDate);
        (byMonth[mk] = byMonth[mk] || []).push(p);
      });
      var months = Object.keys(byMonth).sort();
      var stillToPay = 0;
      var todayIso = todayIsoLocal_();

      months.forEach(function (mk) {
        section.appendChild(el('div', 'status-group-title', mk));
        byMonth[mk].sort(function (a, b) { return a.dueDate.localeCompare(b.dueDate); }).forEach(function (p) {
          section.appendChild(ccPaymentRow_(p));
          if (ccStatus_(p, todayIso) !== 'Paid') stillToPay += p.amountEgp;
        });
      });

      var totalRow = el('div', 'list-row');
      totalRow.appendChild(el('div', 'list-row-main', t('stillToPay')));
      totalRow.appendChild(el('div', 'list-row-amount', fmt(stillToPay)));
      section.appendChild(totalRow);

      container.appendChild(section);
    });
  }

  // -----------------------------------------------------------------------
  // Screen: Plan (US2-US4 — T020-T033)
  // -----------------------------------------------------------------------
  var planState = { monthKey: null };

  function currentMonthKey_() { return monthKey_(todayIsoLocal_()); }

  function openingBalanceForMonth_(monthKey) {
    var current = currentMonthKey_();
    if (monthKey === current) return store.state.total.totalOfAll;
    // Walk forward from the current month, chaining closing balances.
    var opening = store.state.total.totalOfAll;
    var cursor = current;
    while (cursor !== monthKey) {
      var plan = computeMonthlyPlan(store.state, cursor, opening, cursor !== current);
      opening = plan.closingBalance;
      cursor = addMonths_(cursor, 1);
    }
    return opening;
  }

  var PLAN_HORIZON_MONTHS = 12;

  function renderPlanMonthNav(monthKey) {
    var nav = document.getElementById('planMonthNav');
    nav.innerHTML = '';
    var row = el('div', 'field-row');
    var current = currentMonthKey_();
    var horizonEnd = addMonths_(current, PLAN_HORIZON_MONTHS - 1);

    var prevBtn = el('button', 'btn-secondary', '‹ ' + t('prevMonth'));
    prevBtn.type = 'button';
    prevBtn.disabled = monthKey <= current;
    prevBtn.addEventListener('click', function () { planState.monthKey = addMonths_(monthKey, -1); renderPlan(); });

    var label = el('div', 'list-row-title', monthKey);
    label.style.flex = '1 1 auto';
    label.style.textAlign = 'center';

    var nextBtn = el('button', 'btn-secondary', t('nextMonth') + ' ›');
    nextBtn.type = 'button';
    nextBtn.disabled = monthKey >= horizonEnd;
    nextBtn.addEventListener('click', function () { planState.monthKey = addMonths_(monthKey, 1); renderPlan(); });

    row.appendChild(prevBtn); row.appendChild(label); row.appendChild(nextBtn);
    nav.appendChild(row);
  }

  function renderPlanVerdict(plan) {
    var card = document.getElementById('planVerdict');
    card.innerHTML = '';

    var chipsRow = el('div', 'field-row');
    var ccChip = el('div', 'kpi-card');
    ccChip.appendChild(el('div', 'kpi-label', t('creditCardsSubtotal')));
    ccChip.appendChild(el('div', 'kpi-value', fmt(plan.ccTotal)));
    var instChip = el('div', 'kpi-card');
    instChip.appendChild(el('div', 'kpi-label', t('installmentsSubtotal')));
    instChip.appendChild(el('div', 'kpi-value', fmt(plan.installmentTotal)));
    var totalChip = el('div', 'kpi-card');
    totalChip.appendChild(el('div', 'kpi-label', t('monthTotal')));
    totalChip.appendChild(el('div', 'kpi-value', fmt(plan.totalObligations)));
    card.appendChild(ccChip); card.appendChild(instChip); card.appendChild(totalChip);

    var incomeLine = el('p', '');
    if (plan.incomeUnavailable) {
      incomeLine.appendChild(document.createTextNode(t('incomeUnavailable') + ' '));
      var link = document.createElement('a');
      link.href = '#';
      link.textContent = t('setRatePrompt');
      link.addEventListener('click', function (e) { e.preventDefault(); showScreen('rates'); });
      incomeLine.appendChild(link);
    } else if (store.state.income.salary) {
      var salary = store.state.income.salary;
      var native = salary.currency === 'USD' ? fmtUsd(salary.amount) : fmt(salary.amount) + ' EGP';
      incomeLine.textContent = t('expectedIncome') + ': ' + native + ' (' + fmt(plan.totalIncome) + ' EGP)';
    }
    card.appendChild(incomeLine);

    var openingLine = el('p', 'hint');
    openingLine.appendChild(document.createTextNode(t('openingBalanceLabel') + ': ' + fmt(plan.openingBalance) + ' EGP · ' + t('asOf') + ' '));
    // toLocaleString() with no locale argument follows the browser's system
    // locale, which can render Arabic-Indic digits — force en-US so the
    // timestamp stays Latin digits like every other figure (FR-039/A-011).
    var openingAsOfDate = new Date(plan.openingAsOf);
    openingLine.appendChild(bdi(openingAsOfDate.toLocaleDateString('en-US') + ' ' + openingAsOfDate.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })));
    card.appendChild(openingLine);

    var remainingLine = el('p', plan.monthlyShortage > 0 ? 'danger' : '');
    if (plan.monthlyShortage > 0) {
      remainingLine.textContent = t('shortage') + ': ' + fmt(plan.monthlyShortage) + ' EGP ' + t('mustBeCovered');
    } else {
      remainingLine.textContent = t('surplus') + ': ' + fmt(plan.monthlyRemaining) + ' EGP';
    }
    card.appendChild(remainingLine);

    if (plan.firstShortfallDate) {
      var warn = el('div', 'installment-row overdue');
      warn.appendChild(el('div', 'list-row-main', t('firstShortfall') + ': ' + fmtDate(plan.firstShortfallDate)));
      warn.appendChild(el('div', 'list-row-amount', t('amountToPrepare') + ': ' + fmt(plan.amountToPrepare)));
      card.appendChild(warn);
    } else {
      card.appendChild(el('p', '', t('allCovered')));
    }

    renderSalaryEditor_(card);
  }

  /** Income card — salary settings with an edit form (amount/currency/day), T028. */
  function renderSalaryEditor_(card) {
    var salary = store.state.income.salary || { amount: 2250, currency: 'USD', day: 27 };
    var editBtn = el('button', 'btn-secondary', t('editSalary'));
    editBtn.type = 'button';
    var formWrap = el('div', 'form hidden');

    var amountField = el('label', 'field');
    amountField.appendChild(el('span', '', t('amount')));
    var amountInput = document.createElement('input');
    amountInput.type = 'text'; amountInput.inputMode = 'decimal'; amountInput.className = 'editable';
    amountInput.value = salary.amount;
    amountField.appendChild(amountInput);

    var currencyToggle = el('div', 'segmented small');
    ['USD', 'EGP'].forEach(function (cur) {
      var b = el('button', 'segmented-btn' + (salary.currency === cur ? ' selected' : ''), cur);
      b.type = 'button'; b.setAttribute('data-value', cur);
      currencyToggle.appendChild(b);
    });
    wireSegmented(currencyToggle);

    var dayField = el('label', 'field');
    dayField.appendChild(el('span', '', t('salaryDay')));
    var dayInput = document.createElement('input');
    dayInput.type = 'text'; dayInput.inputMode = 'numeric'; dayInput.className = 'editable';
    dayInput.value = salary.day;
    dayField.appendChild(dayInput);

    var saveBtn = el('button', 'btn-primary', t('save'));
    saveBtn.type = 'button';

    formWrap.appendChild(amountField);
    formWrap.appendChild(currencyToggle);
    formWrap.appendChild(dayField);
    formWrap.appendChild(saveBtn);

    editBtn.addEventListener('click', function () { formWrap.classList.toggle('hidden'); });

    saveBtn.addEventListener('click', function () {
      var amount = parseFloat(amountInput.value);
      var currency = selectedSegmentValue(currencyToggle) || 'USD';
      var day = parseInt(dayInput.value, 10);
      if (isNaN(amount) || amount <= 0) { toast(t('mustBePositive'), 'error'); return; }
      if (isNaN(day) || day < 1 || day > 31) { toast(t('mustBePositive'), 'error'); return; }

      var payload = { amount: amount, currency: currency, day: day };
      var prev = store.state.income.salary;
      optimisticWrite({
        apply: function () { store.state.income.salary = payload; },
        revert: function () { store.state.income.salary = prev; },
        rpcName: 'setSalary',
        args: [payload],
        successToastKey: 'paymentSaved'
      }).then(function (slice) {
        if (slice) formWrap.classList.add('hidden');
      });
    });

    card.appendChild(editBtn);
    card.appendChild(formWrap);
  }

  function renderPlanTimeline(plan) {
    var container = document.getElementById('planTimeline');
    container.innerHTML = '';
    if (!plan.timeline.length) {
      container.appendChild(el('p', 'empty-state', t('noObligations')));
      return;
    }
    var byDate = {};
    plan.timeline.forEach(function (e) { (byDate[e.date] = byDate[e.date] || []).push(e); });
    Object.keys(byDate).sort().forEach(function (date) {
      container.appendChild(el('div', 'status-group-title', fmtDate(date)));
      byDate[date].forEach(function (e) {
        var row = el('div', 'list-row');
        var main = el('div', 'list-row-main');
        var label = e.sourceType === 'income' ? t('salary') : (e.sourceType === 'installment' ? t('sourceInstallment') + ' · ' : '');
        var title = el('div', 'list-row-title', label);
        if (e.sourceType !== 'income') title.appendChild(bdi(e.sourceName));
        main.appendChild(title);
        row.appendChild(main);
        row.appendChild(el('div', 'list-row-amount', fmt(e.amountEgp)));
        container.appendChild(row);
      });
    });
  }

  function renderPlan() {
    if (ccSetupGuard_('planSetupNeeded')) {
      document.getElementById('planMonthNav').innerHTML = '';
      document.getElementById('planVerdict').innerHTML = '';
      document.getElementById('planTimeline').innerHTML = '';
      document.getElementById('planAddCcBtn').classList.add('hidden');
      return;
    }
    document.getElementById('planAddCcBtn').classList.remove('hidden');
    if (!planState.monthKey) planState.monthKey = currentMonthKey_();
    var monthKey = planState.monthKey;
    var opening = openingBalanceForMonth_(monthKey);
    var plan = computeMonthlyPlan(store.state, monthKey, opening, monthKey !== currentMonthKey_());

    renderPlanMonthNav(monthKey);
    renderPlanVerdict(plan);
    renderPlanTimeline(plan);

    var addBtn = document.getElementById('planAddCcBtn');
    if (!addBtn.dataset.inited) {
      addBtn.dataset.inited = '1';
      addBtn.addEventListener('click', function () { showScreen('cards'); });
    }
  }
  SCREEN_RENDERERS.plan = renderPlan;

  // -----------------------------------------------------------------------
  // Screen: Forecast (US5 — T034-T036)
  // -----------------------------------------------------------------------
  function renderForecast() {
    if (ccSetupGuard_('forecastSetupNeeded')) {
      document.getElementById('forecastTable').innerHTML = '';
      document.getElementById('forecastBeyondHorizon').textContent = '';
      return;
    }
    var forecast = computeForecast(store.state, 12);
    var table = document.getElementById('forecastTable');
    var rows = ['<tr><th>' + escapeHtml_(t('monthColumn')) + '</th><th>' + escapeHtml_(t('typeIncome')) +
      '</th><th>' + escapeHtml_(t('creditCardsSubtotal')) + '</th><th>' + escapeHtml_(t('installmentsSubtotal')) +
      '</th><th>' + escapeHtml_(t('monthTotal')) + '</th><th>' + escapeHtml_(t('remaining')) + '</th></tr>'];
    forecast.months.forEach(function (m) {
      var remainingLabel = m.monthlyShortage > 0 ? ('-' + fmt(m.monthlyShortage)) : fmt(m.monthlyRemaining);
      var rowClass = m.monthlyShortage > 0 ? ' class="shortage-row"' : '';
      var projLabel = m.isProjection ? ' <span class="hint">(' + escapeHtml_(t('projectionLabel')) + ')</span>' : '';
      rows.push('<tr' + rowClass + ' data-month="' + m.month + '"><td>' + escapeHtml_(m.month) + projLabel + '</td><td>' +
        fmt(m.totalIncome) + '</td><td>' + fmt(m.ccTotal) + '</td><td>' + fmt(m.installmentTotal) + '</td><td>' +
        fmt(m.totalObligations) + '</td><td>' + remainingLabel + '</td></tr>');
    });
    table.innerHTML = rows.join('');
    table.querySelectorAll('tr[data-month]').forEach(function (tr) {
      tr.addEventListener('click', function () {
        planState.monthKey = tr.getAttribute('data-month');
        showScreen('plan');
      });
    });
    var beyond = document.getElementById('forecastBeyondHorizon');
    beyond.textContent = forecast.beyondHorizonTotal > 0 ? t('beyondHorizon') + ': ' + fmt(forecast.beyondHorizonTotal) : '';
  }
  SCREEN_RENDERERS.forecast = renderForecast;

  // -----------------------------------------------------------------------
  // Home plan card (US6 — T037-T039)
  // -----------------------------------------------------------------------
  function renderHomePlanCard() {
    var card = document.getElementById('homePlanCard');
    if (!store.state.creditCards || store.state.creditCards.setup === false) {
      card.classList.add('hidden');
      return;
    }
    card.classList.remove('hidden');
    card.innerHTML = '';
    var summary = computeHomeSummary(store.state);

    card.appendChild(el('h2', '', t('monthlyPlan')));
    card.appendChild(el('p', '', t('dueThisMonth') + ': ' + fmt(summary.stillToPay)));

    if (summary.nearestUnpaid) {
      var line = el('p', '');
      line.appendChild(document.createTextNode(t('nextPayment') + ': '));
      line.appendChild(bdi(summary.nearestUnpaid.sourceName));
      line.appendChild(document.createTextNode(' — ' + fmt(summary.nearestUnpaid.amountEgp) + ' — ' + fmtDate(summary.nearestUnpaid.date)));
      card.appendChild(line);
    } else {
      card.appendChild(el('p', '', t('noUpcomingPayments')));
    }

    if (summary.shortageIndicator) {
      card.appendChild(el('p', 'danger', t('prepareShort') + ': ' + fmt(summary.shortageIndicator.amountToPrepare)));
    }

    if (!card.dataset.inited) {
      card.dataset.inited = '1';
      card.style.cursor = 'pointer';
      card.addEventListener('click', function () { showScreen('plan'); });
    }
  }

  // =======================================================================
  // Screen: Settings & More (T037)
  // =======================================================================
  function renderSettings() {
    document.getElementById('openSheetLink').href = store.state.meta.sheetUrl || '#';
    var langToggle = document.getElementById('languageToggle');
    setSegmentSelected(langToggle, store.lang);
    if (!langToggle.dataset.inited) {
      langToggle.dataset.inited = '1';
      wireSegmented(langToggle);
      langToggle.querySelectorAll('.segmented-btn').forEach(function (b) {
        b.addEventListener('click', function () { applyLanguage(b.getAttribute('data-value')); });
      });
    }
  }
  SCREEN_RENDERERS.settings = renderSettings;

  function renderMore() {
    initNav(); // rebuild more-menu labels on language change
  }
  SCREEN_RENDERERS.more = renderMore;

  // ---------------------------------------------------------------------
  // Refresh (Settings + implicit) — full getState refetch replacing cache
  // ---------------------------------------------------------------------
  function fullRefresh() {
    return rpc('getState').then(function (state) {
      store.state = state;
      store.stale = false;
      persistState();
      renderAsOfIndicator();
      renderActiveScreen();
    }).catch(function (err) {
      showErrorToastForError_(err);
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('refreshBtn').addEventListener('click', fullRefresh);
    document.getElementById('retryBtn').addEventListener('click', boot);
    initNav();
    boot();
  });

  // =======================================================================
  // Boot sequence (T013)
  // =======================================================================
  function boot() {
    document.documentElement.lang = store.lang;
    document.documentElement.dir = store.lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-t]').forEach(function (elm) { elm.textContent = t(elm.getAttribute('data-t')); });

    var cached = loadCachedState();
    if (cached) {
      store.state = cached;
      showScreen('home');
      renderAsOfIndicator();
    } else {
      showScreen('loading');
    }

    rpc('getState').then(function (state) {
      store.state = state;
      store.stale = false;
      persistState();
      renderAsOfIndicator();
      if (!cached) {
        showScreen('home');
      } else {
        renderActiveScreen();
      }
    }).catch(function (err) {
      if (!cached) {
        showScreen('error');
      } else {
        showErrorToastForError_(err);
      }
    });
  }
</script>
