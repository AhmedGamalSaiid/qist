  var CATEGORY_KEYS = [
    ['Salary', 'categorySalary'], ['Freelance', 'categoryFreelance'], ['Food', 'categoryFood'],
    ['Transport', 'categoryTransport'], ['Rent', 'categoryRent'], ['Utilities', 'categoryUtilities'],
    ['Shopping', 'categoryShopping'], ['Health', 'categoryHealth'], ['Education', 'categoryEducation'],
    ['Entertainment', 'categoryEntertainment'], ['Installment', 'categoryInstallment'],
    ['Investment', 'categoryInvestment'], ['Other', 'categoryOther']
  ];

  /**
   * The 13 transaction categories are a controlled vocabulary, so a category
   * read back from the sheet gets the same translation the chips and filters
   * use. Anything outside the list (hand-typed into the sheet) falls through
   * verbatim.
   */
  var CATEGORY_LABEL_KEYS = CATEGORY_KEYS.reduce(function (m, pair) {
    m[pair[0]] = pair[1];
    return m;
  }, {});

  function categoryLabel(value) {
    var key = CATEGORY_LABEL_KEYS[String(value)];
    return key ? t(key) : String(value == null ? '' : value);
  }

  function t(key, vars) {
    var lang = (window.store && store.lang) || 'en';
    var dict = STRINGS[lang] || STRINGS.en;
    var str = dict[key] || STRINGS.en[key] || key;
    if (vars) {
      Object.keys(vars).forEach(function (k) {
        str = str.replace('{' + k + '}', vars[k]);
      });
    }
    return str;
  }

  function fmt(n) {
    if (n === null || n === undefined || isNaN(n)) n = 0;
    return new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 }).format(n);
  }

  function fmtUsd(n) {
    if (n === null || n === undefined || isNaN(n)) n = 0;
    return '$' + new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
  }

  function fmtDate(iso) {
    if (!iso) return '';
    var parts = String(iso).split('-');
    if (parts.length !== 3) return String(iso);
    return parts[1] + '/' + parts[2] + '/' + parts[0];
  }

  function applyLanguage(lang) {
    store.lang = lang;
    localStorage.setItem('isc:lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-t]').forEach(function (el) {
      el.textContent = t(el.getAttribute('data-t'));
    });
    // The as-of indicator lives in the top bar, outside any screen and without
    // a data-t attribute, so nothing above repaints it — it would keep the
    // previous language until the next data load.
    if (typeof renderAsOfIndicator === 'function') renderAsOfIndicator();
    if (typeof renderActiveScreen === 'function') renderActiveScreen();
  }
